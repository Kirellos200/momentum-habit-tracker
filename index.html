<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Momentum — Habit Tracker</title>
<style>
:root{
  --bg:#f6f7fb;--panel:#fff;--text:#18202f;--muted:#6d7482;--line:#e7eaf0;
  --accent:#6c63ff;--accent2:#ebe9ff;--good:#21a179;--warn:#f59e0b;--danger:#ef5350;
  --shadow:0 10px 30px rgba(30,35,55,.07);--radius:18px;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit} button{cursor:pointer;border:0}
.app{display:flex;min-height:100vh}.sidebar{width:240px;background:var(--panel);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh}
.logo{font-weight:800;font-size:23px;padding:10px 12px 22px}.logo span{color:var(--accent)}
.nav{display:grid;gap:6px}.nav button{background:transparent;text-align:left;padding:12px 14px;border-radius:12px;color:var(--muted);font-weight:650}
.nav button.active,.nav button:hover{background:var(--accent2);color:var(--accent)}
.main{flex:1;padding:28px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}
h1{font-size:30px;margin:0 0 5px}.subtitle{color:var(--muted)}
.actions{display:flex;gap:8px;align-items:center}.btn{padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}
.grid{display:grid;gap:18px}.grid.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.two{grid-template-columns:1.25fr 1fr}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.kpi .label{font-size:13px;color:var(--muted);font-weight:650}.kpi .value{font-size:29px;font-weight:800;margin-top:7px}.kpi .mini{font-size:12px;color:var(--muted);margin-top:5px}
.progress{height:10px;background:#eef0f5;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--accent);border-radius:999px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.section-title h2{font-size:18px;margin:0}.section-title small{color:var(--muted)}
.habit-list{display:grid;gap:10px}.habit{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff}
.icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent2);font-size:21px;flex:none}
.habit-main{flex:1;min-width:0}.habit-name{font-weight:750}.habit-meta{font-size:12px;color:var(--muted);margin-top:3px}.habit-right{display:flex;align-items:center;gap:10px}
.check{width:38px;height:38px;border-radius:12px;background:#f0f2f7;color:#a4aab5;font-size:19px}.check.done{background:var(--good);color:#fff}.streak{font-size:12px;color:var(--muted);white-space:nowrap}
.chip{font-size:11px;padding:5px 8px;border-radius:999px;background:#f1f3f7;color:var(--muted);font-weight:700}
.chart{height:230px;display:flex;align-items:flex-end;gap:8px;padding-top:12px}.bar{flex:1;min-width:0;border-radius:8px 8px 4px 4px;background:var(--accent)}.bar-wrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;align-items:center}.bar-label{font-size:10px;color:var(--muted)}
.heatmap{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}.day{aspect-ratio:1;border-radius:4px;background:#eef0f4}.day.l1{background:#d9d5ff}.day.l2{background:#b6afff}.day.l3{background:#9187ff}.day.l4{background:#6c63ff}
.modal-backdrop{position:fixed;inset:0;background:rgba(16,20,30,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{width:min(680px,100%);background:#fff;border-radius:22px;padding:22px;max-height:90vh;overflow:auto}.modal h3{margin:0 0 16px}.form{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;outline:none;background:#fff}.field textarea{min-height:90px}.footer-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.tab-content{display:none}.tab-content.active{display:block}
.calendar-head{display:flex;justify-content:space-between;align-items:center}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:14px}.cal-cell{min-height:90px;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}.cal-cell .date{font-size:12px;color:var(--muted)}.cal-cell.today{outline:2px solid var(--accent)}.cal-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:4px}
.goal{display:grid;gap:9px}.goal-head{display:flex;justify-content:space-between}.goal-bar{height:9px;background:#eef0f5;border-radius:999px;overflow:hidden}.goal-bar span{display:block;height:100%;background:var(--good)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)} .muted{color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.switch{width:44px;height:24px;border-radius:99px;background:#dfe3eb;position:relative}.switch i{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}.switch.on{background:var(--accent)}.switch.on i{left:22px}
@media(max-width:1050px){.grid.cards{grid-template-columns:repeat(2,1fr)}.grid.two{grid-template-columns:1fr}.sidebar{width:210px}}
@media(max-width:760px){.app{display:block}.sidebar{position:sticky;top:0;height:auto;width:100%;z-index:10;padding:10px 10px;border-right:0;border-bottom:1px solid var(--line)}.logo{padding:5px 8px 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px 10px}.main{padding:16px}.grid.cards{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.habit{align-items:flex-start}.habit-right{flex-direction:column}.heatmap{grid-template-columns:repeat(10,1fr)}}
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6c63ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Momentum">
<link rel="apple-touch-icon" href="icons/icon-192.png">

</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">Mo<span>mentum</span></div>
  <div class="nav">
    <button data-tab="today" class="active">Today</button>
    <button data-tab="habits">Habits</button>
    <button data-tab="analytics">Analytics</button>
    <button data-tab="calendar">Calendar</button>
    <button data-tab="goals">Goals</button>
    <button data-tab="settings">Settings</button>
  </div>
</aside>
<main class="main">
  <div class="topbar">
    <div><h1 id="pageTitle">Today</h1><div class="subtitle" id="pageSubtitle"></div></div>
    <div class="actions"><button class="btn" id="themeBtn">☼</button><button class="btn primary" id="addBtn">＋ Add habit</button></div>
  </div>
  <section id="today" class="tab-content active"></section>
  <section id="habits" class="tab-content"></section>
  <section id="analytics" class="tab-content"></section>
  <section id="calendar" class="tab-content"></section>
  <section id="goals" class="tab-content"></section>
  <section id="settings" class="tab-content"></section>
</main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">Add habit</h3>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const KEY='momentum_habits_v1';
const todayISO=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(new Date(d+'T12:00:00'));
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);

let data=load();
let activeTab='today';

function load(){
  const raw=localStorage.getItem(KEY);
  if(raw) return JSON.parse(raw);
  const habits=[
    h('Exercise','🏃','Health','good',30,'min','daily'),
    h('Read','📚','Learning','good',20,'pages','daily'),
    h('Drink water','💧','Health','good',2.5,'L','daily'),
    h('Meditate','🧘','Mindfulness','good',10,'min','daily'),
    h('Study','🎯','Learning','good',60,'min','week:5'),
    h('Social media','📱','Productivity','bad',60,'min','daily','limit')
  ];
  return {habits,goals:[],settings:{dark:false,gamify:true},xp:0};
}
function h(name,icon,cat,type,target,unit,freq,badMode){return {id:uid(),name,icon,category:cat,type,target,unit,freq,badMode,priority:2,created:todayISO(),start:todayISO(),end:'',color:'#6c63ff',log:{}}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function isoOffset(days){const d=new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function parseFreq(f){
  if(f==='daily')return {kind:'daily'};
  if(f.startsWith('week:'))return {kind:'week',n:+f.split(':')[1]};
  if(f.startsWith('month:'))return {kind:'month',n:+f.split(':')[1]};
  if(f.startsWith('interval:'))return {kind:'interval',n:+f.split(':')[1]};
  if(f.startsWith('days:'))return {kind:'days',days:f.slice(5).split(',').map(Number)};
  return {kind:'daily'};
}
function scheduled(h,date){
  if(date<h.start || (h.end&&date>h.end)) return false;
  const f=parseFreq(h.freq), d=new Date(date+'T12:00:00');
  if(f.kind==='daily')return true;
  if(f.kind==='days')return f.days.includes(d.getDay());
  if(f.kind==='week'){
    let count=0; for(let i=0;i<7;i++){let x=new Date(d);x.setDate(d.getDate()-i); if(x.getDay()===d.getDay()){}}
    // week frequency means target occurrences in the rolling 7-day window, represented by a daily eligible slot.
    // To avoid inventing dates, render every day but score a weekly target from completions.
    return true;
  }
  if(f.kind==='month')return d.getDate()===1;
  if(f.kind==='interval'){
    const start=new Date(h.start+'T12:00:00'); return Math.floor((d-start)/86400000)%f.n===0;
  }
  return true;
}
function logFor(h,date){return h.log[date]||{value:0,status:'pending',note:''}}
function isDone(h,date){
  const l=logFor(h,date);
  if(h.type==='bad'){
    if(h.badMode==='quit')return l.value===0 && l.status==='done';
    return l.value<=h.target && l.status==='done';
  }
  return l.status==='done' || l.value>=h.target;
}
function toggle(h,date){
  const l=logFor(h,date);
  if(h.type==='good' && h.target>0 && h.unit!=='') {
    if(isDone(h,date)){h.log[date]={...l,status:'pending',value:0}}
    else h.log[date]={...l,status:'done',value:h.target};
  } else {
    h.log[date]={...l,status:isDone(h,date)?'pending':'done',value:isDone(h,date)?0:l.value};
  }
  data.xp += isDone(h,date)?10:-10; data.xp=Math.max(0,data.xp); save(); renderAll();
}
function occurrences(h,days){
  const arr=[]; const end=new Date(todayISO()+'T12:00:00');
  for(let i=days-1;i>=0;i--){let d=new Date(end);d.setDate(end.getDate()-i);let s=d.toISOString().slice(0,10); if(scheduled(h,s))arr.push(s)}
  return arr;
}
function stats(h,days=30){
  const occ=occurrences(h,days), done=occ.filter(d=>isDone(h,d)).length;
  let streak=0; for(let i=occ.length-1;i>=0;i--){if(isDone(h,occ[i]))streak++; else break}
  const all=occurrences(h,Math.max(365,days)), allDone=all.filter(d=>isDone(h,d)).length;
  let best=0,run=0; for(const d of all){if(isDone(h,d)){run++;best=Math.max(best,run)}else run=0}
  return {eligible:occ.length,done,cons:occ.length?Math.round(done/occ.length*100):0,streak,best,total:allDone};
}
function dailyScore(date=todayISO()){
  const hs=data.habits.filter(h=>scheduled(h,date));
  if(!hs.length)return 0;
  let num=0,den=0; for(const h of hs){const w=h.priority||2; den+=w; if(isDone(h,date))num+=w}
  return Math.round(num/den*100);
}
function renderAll(){document.documentElement.classList.toggle('dark',!!data.settings.dark); renderToday();renderHabits();renderAnalytics();renderCalendar();renderGoals();renderSettings();setPageMeta()}
function setPageMeta(){
  const titles={today:'Today',habits:'Habits',analytics:'Analytics',calendar:'Calendar',goals:'Goals',settings:'Settings'};
  document.getElementById('pageTitle').textContent=titles[activeTab];
  document.getElementById('pageSubtitle').textContent=activeTab==='today'?fmtDate(todayISO()):'Build consistency, one day at a time.';
}
function renderToday(){
  const hs=data.habits.filter(h=>scheduled(h,todayISO()) && !h.archived);
  const done=hs.filter(h=>isDone(h,todayISO())).length, score=dailyScore(), total=hs.length;
  const cur=overallStreak();
  document.getElementById('today').innerHTML=`
  <div class="grid cards">
    <div class="card kpi"><div class="label">Today's progress</div><div class="value">${done}/${total}</div><div class="mini">${total?Math.round(done/total*100):0}% complete</div></div>
    <div class="card kpi"><div class="label">Daily score</div><div class="value">${score}%</div><div class="progress"><span style="width:${score}%"></span></div></div>
    <div class="card kpi"><div class="label">Overall streak</div><div class="value">🔥 ${cur}</div><div class="mini">consecutive scheduled days</div></div>
    <div class="card kpi"><div class="label">XP</div><div class="value">${data.xp}</div><div class="mini">Level ${Math.floor(data.xp/250)+1}</div></div>
  </div>
  <div class="section-title"><h2>Today's habits</h2><small>${total} scheduled</small></div>
  <div class="card">${hs.length?`<div class="habit-list">${hs.map(habitCard).join('')}</div>`:
    `<div class="empty">No habits are scheduled today.<br><button class="btn primary" style="margin-top:12px" onclick="openHabit()">＋ Add a habit</button></div>`}</div>
  <div class="section-title"><h2>Last 30 days</h2><small>overall completion heatmap</small></div>
  <div class="card">${heatmapHTML()}</div>`;
}
function habitCard(h){
  const s=stats(h,30), l=logFor(h,todayISO()), p=h.type==='good'&&h.target?Math.min(100,Math.round((l.value||0)/h.target*100)):isDone(h,todayISO())?100:0;
  return `<div class="habit">
    <div class="icon">${h.icon}</div><div class="habit-main"><div class="habit-name">${esc(h.name)}</div>
    <div class="habit-meta">${esc(h.category)} · ${h.type==='bad'?'Limit':'Goal'} ${h.target}${h.unit?` ${esc(h.unit)}`:''} · ${s.cons}% consistency</div>
    ${h.type==='good'&&h.target?`<div class="progress" style="margin-top:8px"><span style="width:${p}%;background:${h.color||'var(--accent)'}"></span></div>`:''}
    </div><div class="habit-right"><div class="streak">🔥 ${s.streak}</div><button class="check ${isDone(h,todayISO())?'done':''}" onclick="toggleById('${h.id}','${todayISO()}')">${isDone(h,todayISO())?'✓':'○'}</button></div>
  </div>`;
}
function heatmapHTML(){
  const cells=[]; for(let i=29;i>=0;i--){const d=isoOffset(-i);const v=dailyScore(d);let c=v===100?'l4':v>=75?'l3':v>=50?'l2':v>0?'l1':'';cells.push(`<div class="day ${c}" title="${d}: ${v}%"></div>`)}
  return `<div class="heatmap">${cells.join('')}</div>`;
}
function renderHabits(){
  document.getElementById('habits').innerHTML=`<div class="card"><div class="section-title" style="margin-top:0"><h2>All habits</h2><button class="btn primary" onclick="openHabit()">＋ Add habit</button></div>
  ${data.habits.length?`<div class="habit-list">${data.habits.map(h=>{const s=stats(h);return `<div class="habit"><div class="icon">${h.icon}</div><div class="habit-main"><div class="habit-name">${esc(h.name)}</div><div class="habit-meta">${esc(h.category)} · ${h.type} · 🔥 ${s.streak} current · ${s.cons}% consistency</div></div><div class="habit-right"><button class="btn" onclick="editHabit('${h.id}')">Edit</button><button class="btn" onclick="archiveHabit('${h.id}')">${h.archived?'Restore':'Archive'}</button></div></div>`}).join('')}</div>`:'<div class="empty">Start with one small habit.</div>'}</div>`;
}
function renderAnalytics(){
  const hs=data.habits.filter(h=>!h.archived); const avg=hs.length?Math.round(hs.reduce((a,h)=>a+stats(h).cons,0)/hs.length):0;
  document.getElementById('analytics').innerHTML=`<div class="grid cards">
  <div class="card kpi"><div class="label">Average consistency</div><div class="value">${avg}%</div></div>
  <div class="card kpi"><div class="label">Best habit</div><div class="value">${hs.length?esc(hs.slice().sort((a,b)=>stats(b).cons-stats(a).cons)[0].name):'—'}</div></div>
  <div class="card kpi"><div class="label">Total completions</div><div class="value">${hs.reduce((a,h)=>a+stats(h,365).total,0)}</div></div>
  <div class="card kpi"><div class="label">Average daily score</div><div class="value">${Math.round(Array.from({length:30},(_,i)=>dailyScore(isoOffset(-i))).reduce((a,b)=>a+b,0)/30)}%</div></div>
  </div>
  <div class="grid two" style="margin-top:18px"><div class="card"><div class="section-title" style="margin-top:0"><h2>Daily score — 30 days</h2></div>${scoreChart()}</div>
  <div class="card"><div class="section-title" style="margin-top:0"><h2>Habit consistency</h2></div>${hs.length?hs.map(h=>{const s=stats(h);return `<div style="margin:14px 0"><div class="goal-head"><span>${h.icon} ${esc(h.name)}</span><b>${s.cons}%</b></div><div class="progress" style="margin-top:7px"><span style="width:${s.cons}%"></span></div></div>`}).join(''):'<div class="empty">No data yet.</div>'}</div></div>
  <div class="card" style="margin-top:18px"><div class="section-title" style="margin-top:0"><h2>Insights</h2></div>${insights()}</div>`;
}
function scoreChart(){
  const vals=Array.from({length:14},(_,i)=>dailyScore(isoOffset(-(13-i)))); const max=100;
  return `<div class="chart">${vals.map((v,i)=>`<div class="bar-wrap"><div class="bar" style="height:${Math.max(4,v/max*190)}px"></div><div class="bar-label">${isoOffset(-(13-i)).slice(5)}</div></div>`).join('')}</div>`;
}
function insights(){
  const hs=data.habits.filter(h=>!h.archived); if(!hs.length)return '<div class="empty">Add habits to unlock insights.</div>';
  const best=hs.slice().sort((a,b)=>stats(b).cons-stats(a).cons)[0]; const strongest=Array.from({length:7},(_,i)=>({d:i,v:0})); 
  return `<div class="grid two"><div><b>Strongest habit</b><p class="muted">${best.icon} ${esc(best.name)} at ${stats(best).cons}% consistency.</p></div>
  <div><b>Tip</b><p class="muted">Use streaks for motivation, but use consistency to judge long-term progress.</p></div></div>`;
}
function renderCalendar(){
  const now=new Date(); const y=now.getFullYear(),m=now.getMonth(); const first=new Date(y,m,1), start=(first.getDay()+6)%7; const days=new Date(y,m+1,0).getDate(); let cells='';
  for(let i=0;i<start;i++)cells+='<div></div>';
  for(let d=1;d<=days;d++){const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const sc=dailyScore(iso);cells+=`<div class="cal-cell ${iso===todayISO()?'today':''}"><div class="date">${d}</div><div style="margin-top:20px">${sc?`<span class="cal-dot"></span>${sc}%`:'<span class="muted">—</span>'}</div></div>`}
  document.getElementById('calendar').innerHTML=`<div class="card"><div class="calendar-head"><div><h2 style="margin:0">${new Intl.DateTimeFormat(undefined,{month:'long',year:'numeric'}).format(now)}</h2><div class="muted">Daily performance</div></div></div><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="muted" style="font-size:12px;padding:4px">${x}</div>`).join('')}${cells}</div></div>`;
}
function renderGoals(){
  document.getElementById('goals').innerHTML=`<div class="card"><div class="section-title" style="margin-top:0"><h2>Goals</h2><button class="btn primary" onclick="openGoal()">＋ Add goal</button></div>
  ${data.goals.length?data.goals.map(g=>{const p=Math.min(100,Math.round(g.current/g.target*100));return `<div class="goal" style="border:1px solid var(--line);padding:14px;border-radius:14px;margin-bottom:10px"><div class="goal-head"><div><b>${esc(g.name)}</b><div class="muted" style="font-size:12px">${g.current} / ${g.target}</div></div><b>${p}%</b></div><div class="goal-bar"><span style="width:${p}%"></span></div></div>`}).join(''):'<div class="empty">Set a goal that your habits can support.</div>'}</div>`;
}
function renderSettings(){
  document.getElementById('settings').innerHTML=`<div class="card">
   <div class="toggle"><div><b>Dark mode</b><div class="muted">Use a darker interface</div></div><div class="switch ${data.settings.dark?'on':''}" onclick="data.settings.dark=!data.settings.dark;save();renderAll()"><i></i></div></div>
   <div class="toggle"><div><b>Gamification</b><div class="muted">XP and levels</div></div><div class="switch ${data.settings.gamify?'on':''}" onclick="data.settings.gamify=!data.settings.gamify;save();renderAll()"><i></i></div></div>
   <div style="padding-top:18px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="exportJSON()">Export JSON</button><button class="btn" onclick="exportCSV()">Export CSV</button><button class="btn" onclick="importPrompt()">Import JSON</button><button class="btn" onclick="resetDemo()">Reset demo data</button></div>
  </div>`;
}
function overallStreak(){
  let streak=0; for(let i=0;i<365;i++){const d=isoOffset(-i); const hs=data.habits.filter(h=>scheduled(h,d)&&!h.archived); if(!hs.length)continue; if(dailyScore(d)>=100)streak++; else break} return streak;
}
function openHabit(existing=null){
  const h0=existing||{name:'',icon:'✨',category:'Other',type:'good',target:1,unit:'times',freq:'daily',badMode:'limit',priority:2,start:todayISO(),end:'',color:'#6c63ff'};
  modal('Add / edit habit',`<div class="form">
    <div class="row"><div class="field"><label>Name</label><input id="f_name" value="${escAttr(h0.name)}"></div><div class="field"><label>Icon</label><input id="f_icon" value="${escAttr(h0.icon)}"></div></div>
    <div class="row"><div class="field"><label>Category</label><select id="f_cat">${['Health','Fitness','Learning','Productivity','Personal','Finance','Social','Mindfulness','Other'].map(x=>`<option ${x===h0.category?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="field"><label>Type</label><select id="f_type"><option value="good" ${h0.type==='good'?'selected':''}>Good habit</option><option value="bad" ${h0.type==='bad'?'selected':''}>Bad habit</option></select></div></div>
    <div class="row"><div class="field"><label>Target</label><input id="f_target" type="number" min="0" step="0.1" value="${h0.target}"></div><div class="field"><label>Unit</label><input id="f_unit" value="${escAttr(h0.unit)}" placeholder="min, pages, L..."></div></div>
    <div class="row"><div class="field"><label>Frequency</label><select id="f_freq"><option value="daily">Every day</option><option value="week:3" ${h0.freq==='week:3'?'selected':''}>3 times / week</option><option value="week:5" ${h0.freq==='week:5'?'selected':''}>5 times / week</option><option value="month:1" ${h0.freq==='month:1'?'selected':''}>Monthly</option><option value="interval:2" ${h0.freq==='interval:2'?'selected':''}>Every 2 days</option></select></div><div class="field"><label>Importance</label><select id="f_priority"><option value="1" ${h0.priority===1?'selected':''}>Low</option><option value="2" ${h0.priority===2?'selected':''}>Normal</option><option value="3" ${h0.priority===3?'selected':''}>High</option></select></div></div>
    <div class="row"><div class="field"><label>Start date</label><input id="f_start" type="date" value="${h0.start}"></div><div class="field"><label>End date</label><input id="f_end" type="date" value="${h0.end||''}"></div></div>
    <div class="footer-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveHabit('${h0.id||''}')">Save habit</button></div>
  </div>`);
}
function saveHabit(id){
  const obj={name:val('f_name'),icon:val('f_icon')||'✨',category:val('f_cat'),type:val('f_type'),target:+val('f_target')||0,unit:val('f_unit'),freq:val('f_freq'),priority:+val('f_priority'),start:val('f_start')||todayISO(),end:val('f_end'),badMode:'limit',color:'#6c63ff',log:{},id:id||uid(),created:todayISO()};
  if(id){const old=data.habits.find(h=>h.id===id); obj.log=old.log;obj.created=old.created;obj.archived=old.archived;data.habits=data.habits.map(h=>h.id===id?obj:h)}else data.habits.push(obj);
  save();closeModal();renderAll();
}
function editHabit(id){openHabit(data.habits.find(h=>h.id===id))}
function archiveHabit(id){const h=data.habits.find(h=>h.id===id);h.archived=!h.archived;save();renderAll()}
function openGoal(){
  modal('Add goal',`<div class="form"><div class="field"><label>Goal name</label><input id="g_name"></div><div class="row"><div class="field"><label>Current value</label><input id="g_cur" type="number" value="0"></div><div class="field"><label>Target</label><input id="g_tar" type="number" value="100"></div></div><div class="footer-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveGoal()">Save goal</button></div></div>`);
}
function saveGoal(){data.goals.push({id:uid(),name:val('g_name')||'New goal',current:+val('g_cur')||0,target:+val('g_tar')||1});save();closeModal();renderAll()}
function modal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalBackdrop').style.display='flex'}
function closeModal(){document.getElementById('modalBackdrop').style.display='none'}
function toggleById(id,date){toggle(data.habits.find(h=>h.id===id),date)}
function val(id){return document.getElementById(id).value}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function escAttr(s){return esc(s)}
function exportJSON(){download('momentum-data.json',JSON.stringify(data,null,2),'application/json')}
function exportCSV(){
  let out='habit,date,status,value\n';data.habits.forEach(h=>Object.entries(h.log).forEach(([d,l])=>out+=`"${h.name.replaceAll('"','""')}","${d}","${l.status}",${l.value||0}\n`));download('momentum-habits.csv',out,'text/csv')
}
function importPrompt(){const raw=prompt('Paste exported JSON here');if(!raw)return;try{data=JSON.parse(raw);save();renderAll()}catch(e){alert('Invalid JSON')}}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function resetDemo(){if(confirm('Reset all data to the demo setup?')){localStorage.removeItem(KEY);data=load();renderAll()}}

document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{activeTab=b.dataset.tab;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));document.getElementById(activeTab).classList.add('active');setPageMeta()}));
document.getElementById('addBtn').onclick=()=>openHabit();
document.getElementById('themeBtn').onclick=()=>{data.settings.dark=!data.settings.dark;save();renderAll()};
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});

if(data.settings.dark){
  const st=document.createElement('style');st.textContent='.dark{--bg:#0f131b;--panel:#171c26;--text:#edf0f7;--muted:#9aa3b2;--line:#293140;--accent2:#262341}.dark .habit,.dark .cal-cell,.dark .field input,.dark .field select,.dark .field textarea,.dark .modal{background:#171c26}.dark .progress{background:#293140}.dark .day{background:#262b35}.dark .btn{background:#171c26;color:var(--text);border-color:var(--line)}';document.head.appendChild(st)
}
renderAll();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>

</body>
